[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherbus"
version = "0.1.0"
description = "Event-driven context layer for AI agents — CloudEvents over NATS/Kafka with MCP-native resolution and replay."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Shazeb" }]
keywords = ["agents", "mcp", "cloudevents", "nats", "kafka", "pubsub", "ai", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "cloudevents>=1.10",
    "nats-py>=2.7",
    "typer>=0.12",
    "anyio>=4.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10"]
mcp = ["mcp>=0.9"]
replay = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "jinja2>=3.1,<4"]
langgraph = ["langgraph>=0.0.40"]
crewai = ["crewai>=0.30"]
openai = ["openai-agents>=0.0.1"]
vec = ["chromadb>=0.5", "qdrant-client>=1.9"]
git = ["pygit2>=1.15"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers>=4.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
    "mcp>=1.0",  # exercises the MCP adapter in tests; also required for `aetherbus-mcp`
    "respx>=0.21",  # httpx mock transport for https resolver tests
    "aiokafka>=0.10",  # Kafka transport conformance tests
    "fastapi>=0.110",  # Replay UI backend tests
    "uvicorn[standard]>=0.29",  # `aetherbus-ui serve`
    "websockets>=12",  # WebSocket client for replay-tail tests
    "jinja2>=3.1",  # template engine for the minimal HTML viewer
    "build>=1.2,<2",  # scripts/build-wheel.sh builds the SPA-bundled release wheel
]
all = ["aetherbus[kafka,mcp,replay,langgraph,crewai,openai,vec,git]"]

[project.scripts]
aetherbus-mcp = "aetherbus.mcp_adapter.cli:main"
aetherbus-ui = "aetherbus.replay_ui.backend.cli:main"
# `aetherbus` umbrella CLI (init/tail/publish/replay/...) lands in a later
# milestone once each subcommand has a backing implementation.

[project.urls]
Homepage = "https://github.com/shazeb/aetherbus"
Repository = "https://github.com/shazeb/aetherbus"
Issues = "https://github.com/shazeb/aetherbus/issues"

# Third-party resolvers register under the `aetherbus.resolvers` entry-point
# group; see aetherbus.resolver._load_entry_point_resolvers. Built-ins ship as
# direct imports inside `aetherbus.resolver.__init__`, no entry point needed.

[tool.hatch.build.targets.wheel]
packages = ["src/aetherbus"]
# Strip frontend source from the wheel — only the built SPA under dist/ is
# useful at runtime. Hatch sweeps the whole package tree by default; this
# excludes the noisy source/config bits. The built dist/ is opted back in by
# `artifacts` below.
exclude = [
    "src/aetherbus/replay_ui/frontend/src/**",
    "src/aetherbus/replay_ui/frontend/node_modules/**",
    "src/aetherbus/replay_ui/frontend/index.html",
    "src/aetherbus/replay_ui/frontend/package.json",
    "src/aetherbus/replay_ui/frontend/package-lock.json",
    "src/aetherbus/replay_ui/frontend/tsconfig.json",
    "src/aetherbus/replay_ui/frontend/tsconfig.node.json",
    "src/aetherbus/replay_ui/frontend/vite.config.ts",
    "src/aetherbus/replay_ui/frontend/tailwind.config.ts",
    "src/aetherbus/replay_ui/frontend/postcss.config.js",
]

# Bundle the built Replay UI SPA (src/aetherbus/replay_ui/frontend/dist/) into
# the wheel. dist/ is gitignored and only exists after `npm run build`, so
# hatch skips it as a VCS-ignored path unless it is opted back in here.
#
# `artifacts` is glob-based and — unlike `force-include` — tolerates a missing
# source: on a clean checkout (no dist/) the pattern matches nothing and the
# wheel still builds, so `pip install git+…` works and the backend serves the
# Jinja fallback viewer. The release flow (scripts/build-wheel.sh) builds the
# SPA first, so the pattern matches and the SPA ships in the wheel. Scoped to
# the wheel target only; the sdist intentionally carries no built SPA.
artifacts = [
    "src/aetherbus/replay_ui/frontend/dist/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live broker (testcontainers)",
    "e2e: end-to-end multi-agent pipeline tests",
]

[tool.coverage.run]
branch = true
source = ["src/aetherbus"]
