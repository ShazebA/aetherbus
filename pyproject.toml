[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherbus"
version = "0.1.0"
description = "Event-driven context layer for AI agents — CloudEvents over NATS/Kafka with MCP-native resolution and replay."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Shazeb" }]
keywords = ["agents", "mcp", "cloudevents", "nats", "kafka", "pubsub", "ai", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "cloudevents>=1.10",
    "nats-py>=2.7",
    "typer>=0.12",
    "anyio>=4.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10"]
mcp = ["mcp>=0.9"]
replay = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12"]
langgraph = ["langgraph>=0.0.40"]
crewai = ["crewai>=0.30"]
openai = ["openai-agents>=0.0.1"]
vec = ["chromadb>=0.5", "qdrant-client>=1.9"]
git = ["pygit2>=1.15"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers>=4.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
    "mcp>=1.0",  # exercises the MCP adapter in tests; also required for `aetherbus-mcp`
    "respx>=0.21",  # httpx mock transport for https resolver tests
    "aiokafka>=0.10",  # Kafka transport conformance tests
]
all = ["aetherbus[kafka,mcp,replay,langgraph,crewai,openai,vec,git]"]

[project.scripts]
aetherbus-mcp = "aetherbus.mcp_adapter.cli:main"
# `aetherbus` umbrella CLI (init/tail/publish/replay/...) lands in a later
# milestone once each subcommand has a backing implementation.

[project.urls]
Homepage = "https://github.com/shazeb/aetherbus"
Repository = "https://github.com/shazeb/aetherbus"
Issues = "https://github.com/shazeb/aetherbus/issues"

# Third-party resolvers register under the `aetherbus.resolvers` entry-point
# group; see aetherbus.resolver._load_entry_point_resolvers. Built-ins ship as
# direct imports inside `aetherbus.resolver.__init__`, no entry point needed.

[tool.hatch.build.targets.wheel]
packages = ["src/aetherbus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live broker (testcontainers)",
    "e2e: end-to-end multi-agent pipeline tests",
]

[tool.coverage.run]
branch = true
source = ["src/aetherbus"]
